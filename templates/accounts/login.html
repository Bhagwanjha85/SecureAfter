{% extends 'base.html' %}
{% load static %}

{% block title %}Login - SecureAfter{% endblock %}

{% block content %}
<div class="auth-page-wrapper">
    <div class="auth-card">
        <a href="{% url 'home' %}" class="back-home-link"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <div class="auth-header">
            <i class="fas fa-shield-alt auth-icon"></i>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to access your secure vault</p>
        </div>

        <form method="POST" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label" for="username">Username, email or phone</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Enter your username, email or phone">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
            </div>

            <div class="form-group" style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem;">
                <input type="checkbox" id="remember_me" name="remember_me">
                <label for="remember_me" style="color: var(--text-color-secondary); font-size: 0.9rem; margin: 0;">Remember me</label>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="auth-links">
            <p>Don't have an account? <a href="{% url 'accounts:register' %}">Create Account</a></p>
            <p><a href="{% url 'accounts:forgot_password' %}">Forgot your password?</a></p>
        </div>
    </div>
</div>

<style>
    :root {
        --primary-blue: #2563eb;
        --primary-blue-hover: #1d4ed8;
        --primary-blue-light: #eff6ff;
        --text-color-primary: #111827;
        --text-color-secondary: #6b7280;
        --border-color-soft: #e5e7eb;
        --bg-professional: #f8fafc;
    }

    body {
        background-color: var(--bg-professional);
    }

    .back-home-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-color-secondary);
        text-decoration: none;
        font-size: 0.9rem;
        font-weight: 500;
        margin-bottom: 1.5rem;
        transition: color 0.2s;
    }

    .back-home-link:hover {
        color: var(--primary-blue);
    }

    .auth-page-wrapper {
        min-height: calc(100vh - 120px);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1rem;
    }

    .auth-card {
        background: white;
        width: 100%;
        max-width: 450px;
        padding: 2.5rem;
        border-radius: 12px;
        border: 1px solid var(--border-color-soft);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 10px 15px -3px rgba(37, 99, 235, 0.1);
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-header h2 {
        font-size: 1.875rem;
        font-weight: 800;
        color: var(--text-color-primary);
        margin-bottom: 0.5rem;
    }

    .auth-header p {
        color: var(--text-color-secondary);
        font-size: 0.95rem;
    }

    .form-group {
        margin-bottom: 1.25rem;
    }

    .form-label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-color-primary);
        margin-bottom: 0.4rem;
    }

    .form-control {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border-color-soft);
        border-radius: 8px;
        font-size: 1rem;
        color: var(--text-color-primary);
        background-color: #ffffff;
        transition: all 0.2s ease;
        box-sizing: border-box;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary-blue);
        box-shadow: 0 0 0 3px var(--primary-blue-light);
    }

    .btn-primary {
        display: inline-block;
        width: 100%;
        padding: 0.875rem 1.5rem;
        background-color: var(--primary-blue);
        color: #ffffff;
        font-weight: 600;
        font-size: 1rem;
        text-align: center;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background-color 0.2s ease, transform 0.1s ease;
        margin-top: 0.5rem;
    }

    .btn-primary:hover {
        background-color: var(--primary-blue-hover);
    }

    .btn-primary:active {
        transform: scale(0.98);
    }

    .auth-links {
        margin-top: 1.5rem;
        text-align: center;
        color: var(--text-color-secondary);
        font-size: 0.9rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .auth-links a {
        color: var(--primary-blue);
        font-weight: 600;
        text-decoration: none;
        transition: color 0.2s;
    }

    .auth-links a:hover {
        color: var(--primary-blue-hover);
        text-decoration: underline;
    }

    .auth-icon {
        font-size: 2.5rem;
        color: var(--primary-blue);
        margin-bottom: 1rem;
    }
</style>
{% endblock %}
