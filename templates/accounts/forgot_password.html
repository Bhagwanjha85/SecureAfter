{% extends 'base.html' %} {% block title %}Forgot Password - SecureAfter{% endblock %} 
{% block content %}
<style>
  .auth-container {
    max-width: 450px;
    margin: 4rem auto;
    padding: 0 1rem;
  }
  .auth-card {
    background: white;
    padding: 2.5rem;
    border-radius: 24px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    border: 1px solid var(--border-color);
  }
  .auth-header {
    text-align: center;
    margin-bottom: 2rem;
  }
  .auth-title {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--text-color);
    margin-bottom: 0.5rem;
  }
  .auth-subtitle {
    color: var(--text-secondary);
    font-size: 0.95rem;
  }
  .form-group {
    margin-bottom: 1.5rem;
  }
  .form-label {
    display: block;
    margin-bottom: 0.5rem;
    font-weight: 600;
    color: var(--text-color);
  }
  .form-control {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 2px solid var(--border-color);
    border-radius: 12px;
    font-size: 1rem;
    transition: all 0.3s;
  }
  .form-control:focus {
    border-color: var(--primary-color);
    outline: none;
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
  }
  .btn-primary {
    width: 100%;
    padding: 1rem;
    background: linear-gradient(135deg, var(--primary-color), #6366f1);
    color: white;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
  }
  .back-link {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: var(--text-secondary);
    text-decoration: none;
    font-weight: 500;
  }
  .back-link:hover {
    color: var(--primary-color);
  }
</style>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Enter your email to receive a reset code</p>
    </div>

    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          required
          placeholder="Enter your registered email"
        />
      </div>

      <button type="submit" class="btn btn-primary">Send Reset Code</button>
    </form>

    <a href="{% url 'accounts:login' %}" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Login
    </a>
  </div>
</div>
{% endblock %}
