{% extends 'base.html' %}

{% block title %}Register - SecureAfter{% endblock %}

{% block content %}
<style>
    .auth-container {
        max-width: 600px;
        margin: 3rem auto;
    }
    
    .auth-card {
        background: white;
        border-radius: 16px;
        padding: 3rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }
    
    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .auth-header h1 {
        font-size: 2rem;
        color: #667eea;
        margin-bottom: 0.5rem;
    }
    
    .auth-header p {
        color: #6b7280;
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    
    .login-link {
        text-align: center;
        margin-top: 1.5rem;
        color: #6b7280;
    }
    
    .login-link a {
        color: #667eea;
        text-decoration: none;
        font-weight: 600;
    }
</style>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>🔒 Create Account</h1>
            <p>Start securing your important documents today</p>
        </div>
        
        <form method="POST" action="{% url 'accounts:register' %}">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Phone Number (Optional)</label>
                <input type="tel" id="phone" name="phone" class="form-control" placeholder="+91 1234567890">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" class="form-control" required minlength="8">
                </div>
                
                <div class="form-group">
                    <label for="password2">Confirm Password *</label>
                    <input type="password" id="password2" name="password2" class="form-control" required minlength="8">
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-top: 1rem;">
                Create Account
            </button>
        </form>
        
        <div class="login-link">
            Already have an account? <a href="{% url 'accounts:login' %}">Login here</a>
        </div>
    </div>
</div>
{% endblock %}
